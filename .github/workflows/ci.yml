name: Lab 8 Secure Transfer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pycryptodome pytest
        pip install -e .
    - name: Debug - list files
      run: |
        ls -la
        ls -la tests/
    - name: Debug - test import
      run: |
        python -c "import secure_transfer_utils; print('IMPORT SUCCESS')"
    - name: Run tests
      run: |
        pytest tests/ -v
